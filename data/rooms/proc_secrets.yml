name: Process Secrets
description: A chamber where the system's most active processes reveal their secrets.
detailed_description: 'The /proc directory has manifested as a strange, pulsating
  chamber where the inner workings of the system''s core processes are laid bare.
  Countless streams of data flow through transparent conduits, showing the real-time
  operation of the entire system.


  By observing these processes, you can learn valuable secrets about how the system
  functions and potentially gain advantages against corrupted entities. This place
  seems to exist outside normal directory rules, providing a window into the system''s
  deepest operations.


  In the center, a swirling vortex of pure process information forms patterns that
  seem to contain powerful insights.

  '
exits:
- mnt_forest
items: []
enemies: []
npcs:
- scheduler_process.sys
hidden: false

# Navigation: canonical path + everything a player may type to get here.
path: "/proc"
aliases: ["/proc", "/proc/secrets", "proc", "secrets"]

flag:
  via: kill
  enemy: runaway_fork.bomb
  pid: 1337
  process: "runaway_fork"
  text: "FLAG{kill_ends_what_ps_finds}"
  nudge: "Something is eating this directory's CPU. ps shows what's running."
  command: "[bold]ps[/bold], then [bold]kill 1337[/bold]"
  teach: "Something here doesn't belong. [bold]ps[/bold] lists the processes running in this directory — look for the odd one out, then end it with [bold]kill[/bold] and its PID number. Type [bold]ps[/bold], then [bold]kill 1337[/bold]."
  clue: "One of my children forked and never stopped. Find it with ps. End it with kill."

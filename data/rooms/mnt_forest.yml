name: Mount Forest
description: A vast, corrupted landscape where external systems connect to the core.
detailed_description: |
  The /mnt directory has become a sprawling digital forest where external filesystems connect to the core system. Massive data trunks rise like trees, their branches splitting into countless connections that vanish into the distance.
  
  Corruption has spread deeply here, with glitched terrain and fragmented pathways. The sound of corrupted processes can be heard throughout, and dark energy pulses through the ground like malevolent roots.
  
  This vast area seems to be a critical junction between different parts of the system, with pathways leading to even more dangerous territories.
exits:
  - home_grove
  - opt_mage_tower
  - srv_warrior_tomb
  - proc_secrets
items:
  - lost_user_log
# Items placed dynamically by class-based system
enemy_tier: 2
enemy_count: 1
npcs:
  - lost_user.dat
hidden: false
zone: "natural"
zone_level: 2
class_affinity: "shaman" 

# Navigation: canonical path + everything a player may type to get here.
path: "/mnt"
aliases: ["/mnt", "mnt", "forest"]

flag:
  file: lost_user_log
  via: grep
  text: "FLAG{grep_finds_needles}"
  grants: lib_key
  nudge: "That log is hundreds of lines. Don't read it — search it."
  command: "[bold]grep FLAG lost_user_log[/bold]"
  teach: "The lost user's log here is hundreds of lines long — too long to read. [bold]grep[/bold] searches a file for a word and prints only the lines containing it. Type [bold]grep FLAG lost_user_log[/bold]."
  clue: "I wrote everything down in my log... but it's so long now. I can't find anything in it."

name: Server Warrior Tomb
description: An ancient battleground where digital warriors test their strength.
detailed_description: 'The /srv directory has transformed into a massive stone fortress
  resembling an ancient tomb dedicated to digital warriors. Weapon-like data structures
  line the walls, and the floor is inscribed with battle patterns resembling both
  circuit diagrams and martial formations.


  This area resonates with those who rely on strength and combat prowess. For a fighter,
  the environment seems to enhance your physical abilities and combat skills.


  Deep within the tomb, a powerful corrupted entity awaits challengers - the source
  of corruption that has infected the system''s core services.

  '
exits:
- mnt_forest
items:
  - access_log
  - access_readme
enemies:
- tomb_guardian.sys
- corruption_overlord.exe
npcs: []
locked: true
key_required: opt_key
trial_class: guardian
hidden: false

# Navigation: canonical path + everything a player may type to get here.
path: "/srv"
aliases: ["/srv", "srv", "tomb"]

flag:
  file: access_log
  via: grep
  text: "FLAG{warriors_leave_access_logs}"
  nudge: "Read the keeper's note, then search the access log."
  command: "[bold]grep FLAG access_log[/bold]"

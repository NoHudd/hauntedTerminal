name: Hidden Directory
description: A secret directory that few know about. It contains ancient system knowledge.
detailed_description: This hidden directory is a repository of ancient system knowledge,
  untouched by the corruption. The walls are lined with pristine code structures and
  archived commands from the early days of computing. This place feels sacred, preserved
  from the chaos that affected the rest of the system.
exits:
- root
items:
  - flag
npcs:
- guardian.bin
enemies: []
locked: true
key_required: system_badge
hidden: true

# Navigation: canonical path + everything a player may type to get here.
path: "/root"
aliases: ["/root", "/ghost", "ghost"]

flag:
  file: flag
  text: "FLAG{root_sees_all}"
  nudge: "root keeps its flag hidden, like any dotfile."
  command: "[bold]ls -a[/bold], then [bold]cat .flag[/bold]"

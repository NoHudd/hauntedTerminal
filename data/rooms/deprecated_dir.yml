name: Deprecated Directory
description: An old, abandoned directory marked for deletion. It feels unsettling.
detailed_description: This deprecated directory exists in a strange state between
  deletion and persistence. The digital walls seem to be made of old directory structures,
  forgotten and unused. File fragments flicker in and out of existence, and occasional
  error messages float through the air like ghostly whispers. There's a faint path
  back to the main filesystem, suggesting a way out.
exits:
- root
items:
  - tmp_notice
npcs: []
enemies: []
locked: false
hidden: false

# Navigation: canonical path + everything a player may type to get here.
path: "/var/tmp"
aliases: ["/var/tmp", "/deprecated", "deprecated"]

flag:
  via: kill
  enemy: zombie_tmpwatch.sh
  pid: 2048
  process: "tmpwatch --zombie"
  text: "FLAG{zombies_need_reaping}"
  nudge: "Read the notice, then find the dead-but-running process."
  command: "[bold]ps[/bold], then [bold]kill 2048[/bold]"

# Live difficulty multipliers.
#
# Re-tuned 2026-09-29 for room flags. Runs now include the three rogue-process
# fights (/proc, /var/tmp, /etc — their flags help open /boot) and up to 12
# flags' worth of XP (15 cycles each). The XP outweighed the extra fights, so
# every mode had become near-certain; only enemy_damage moved.
#
# Sim @80 runs/class (python -m sim.tune --mode all --runs 80), avg win rate:
#            before (dmg 0.90/0.95/0.85)   after (dmg 1.0/1.1/1.0)   band
#   easy     98.8%                         95.8%                     90-98
#   medium   97.1%                         81.7%                     75-85
#   hard     98.3%                         65.4%                     50-70
#
# Per-class spread is wide after this tune (medium: G 91 / W 59 / S 95;
# hard: G 81 / W 66 / S 49). The tuner balances averages only; evening the
# classes out is kit work, not a global multiplier.
#
# Hard is harder than medium through enemy_hp 1.15 (longer fights), not per-hit
# damage. xp_gain is high across the board because enemies award their real
# `experience` value, which is far below the flat 50 the game once assumed.
#
# Calibrated by: python -m sim.tune --mode all --runs 80
easy:
  enemy_hp: 0.85
  enemy_damage: 1.0
  xp_gain: 2.4
medium:
  enemy_hp: 0.95
  enemy_damage: 1.1
  xp_gain: 2.0
hard:
  enemy_hp: 1.15
  enemy_damage: 1.0
  xp_gain: 1.8

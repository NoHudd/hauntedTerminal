# Live difficulty multipliers.
#
# Re-tuned 2026-09-30 for room flags. Runs now include the three rogue-process
# fights (/proc, /var/tmp, /etc) and up to 12 flags' worth of XP (15 cycles
# each), which made every mode near-certain (avg 97-99%).
#
# enemy_damage is held equal (0.9) and ordered with enemy_hp
# (easy <= medium <= hard), so no mode hits harder per blow than a harder one;
# the ramp comes from enemy_hp. xp_gain barely moves outcomes; enemy_hp is
# steep (hard: 1.10 -> 66%, 1.15 -> 46%).
#
# Chosen by a grid on seed 1000 @100 runs/class, verified out of sample on
# seed 2000 @200 runs/class (sim.simulator.measure), avg win rate:
#            guardian  weaver  shaman   avg     band
#   easy     97.0%     90.0%   99.5%    95.5%   90-98
#   medium   88.5%     72.5%   89.0%    83.3%   75-85
#   hard     77.0%     55.5%   72.0%    68.2%   50-70
#
# The sim gives rogue kills no gear progress (the game drops none), and pays
# flag XP raw while combat XP is scaled, as the game does. Weaver is weakest
# in every mode; evening the classes out is kit work, not a multiplier.
easy:
  enemy_hp: 0.85
  enemy_damage: 0.9
  xp_gain: 2.4
medium:
  enemy_hp: 1.05
  enemy_damage: 0.9
  xp_gain: 1.8
hard:
  enemy_hp: 1.1
  enemy_damage: 0.9
  xp_gain: 1.8
